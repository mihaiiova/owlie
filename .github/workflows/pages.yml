name: Deploy release corpus to GitHub Pages

# Publishes the controlled article/feed corpus used by the release E2E gate.
# Requires GitHub Pages to be enabled with "GitHub Actions" as the source.

on:
  push:
    branches: [main]
    paths:
      - 'e2e/corpus/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: e2e/corpus

      - id: deployment
        uses: actions/deploy-pages@v4
