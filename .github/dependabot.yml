version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    # Day-to-day work integrates on development; main only receives releases.
    target-branch: 'development'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    # Only patch and minor version updates. Major bumps are breaking by
    # definition and are handled deliberately (with a changeset), so
    # Dependabot never proposes them automatically.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    # Group by tool so one toolchain's update never bundles unrelated tools
    # (the previous dependency-type grouping produced risky mega-PRs).
    groups:
      typescript:
        patterns: [typescript]
      eslint:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint']
      vitest:
        patterns: ['vitest', '@vitest/*']
      changesets:
        patterns: ['@changesets/*']
      # The provider packages are typed against the ai core, so a provider bump
      # alone fails typecheck; keep them in one PR.
      ai-sdk:
        patterns: ['ai', '@ai-sdk/*']
